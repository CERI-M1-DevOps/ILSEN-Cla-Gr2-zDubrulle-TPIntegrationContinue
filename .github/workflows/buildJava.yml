name: Java CI with Maven - Test and package

on:
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  JavaCI:
    name: Java CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - name: Run tests
        run: mvn –B package